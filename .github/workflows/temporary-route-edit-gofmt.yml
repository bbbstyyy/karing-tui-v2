name: temporary-route-edit-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/temporary-route-edit-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'bbbstyyy/karing-tui-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - name: Gofmt route edit slice
        run: |
          gofmt -w internal/declaration/route_patch.go internal/declaration/route_patch_test.go internal/daemon/declaration_compiler.go internal/daemon/route_edit.go internal/daemon/route_edit_routes.go internal/daemon/route_edit_test.go internal/daemon/server.go internal/apiv1/types.go internal/client/client.go internal/client/route_edit_test.go internal/app/app.go internal/app/route_config_cli.go internal/app/route_config_cli_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/declaration/route_patch.go internal/declaration/route_patch_test.go internal/daemon/declaration_compiler.go internal/daemon/route_edit.go internal/daemon/route_edit_routes.go internal/daemon/route_edit_test.go internal/daemon/server.go internal/apiv1/types.go internal/client/client.go internal/client/route_edit_test.go internal/app/app.go internal/app/route_config_cli.go internal/app/route_config_cli_test.go
            git commit -m "style(m4): format compiled route edit stage and tests"
            git push origin HEAD:feat/m0-m1-foundation
          fi
