name: temporary-binding-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/temporary-binding-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'bbbstyyy/karing-tui-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - name: Gofmt bounded Routing target and DNS chooser
        run: |
          gofmt -w internal/tui/route_binding.go internal/tui/route_binding_test.go internal/tui/route_toggle.go internal/tui/route_toggle_test.go internal/tui/config_inspect.go internal/tui/model.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/tui/route_binding.go internal/tui/route_binding_test.go internal/tui/route_toggle.go internal/tui/route_toggle_test.go internal/tui/config_inspect.go internal/tui/model.go
            git commit -m "style(m4): format guarded route target and DNS editor"
            git push origin HEAD:feat/m0-m1-foundation
          fi
