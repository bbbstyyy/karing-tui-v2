name: format-once
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/format-once.yml
      - internal/app/profile_cli.go
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/m0-m1-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Format tracked Go files
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -w
          git add -u
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: gofmt M3 node management changes'
            git push origin HEAD:feat/m0-m1-foundation
          fi
