name: one-time-m4-sealed-fix-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/one-time-m4-sealed-fix-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - name: Format sealed source and push
        run: |
          gofmt -w internal/backupclosure/sealed_archive_linux.go
          if ! git diff --quiet -- internal/backupclosure/sealed_archive_linux.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/backupclosure/sealed_archive_linux.go
            git commit -m "style(m4): gofmt sealed archive size fixes"
            git push origin HEAD:feat/m0-m1-foundation
          fi
