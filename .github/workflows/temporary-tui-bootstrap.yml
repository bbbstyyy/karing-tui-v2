name: temporary TUI dependency and format bootstrap
on:
  push:
    branches: [feat/m0-m1-foundation]
    paths:
      - .github/workflows/temporary-tui-bootstrap.yml
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Pin Bubble Tea transitive modules and format new TUI
        env:
          GOTOOLCHAIN: local
        run: |
          go mod tidy
          gofmt -w internal/tui internal/app/app.go internal/app/tui_command_test.go
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum internal/tui internal/app/app.go internal/app/tui_command_test.go
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock Bubble Tea v1 and format read-only TUI'
            git push origin HEAD:feat/m0-m1-foundation
          fi
