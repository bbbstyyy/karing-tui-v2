name: one-time declaration stage gofmt
on:
  push:
    branches: [feat/m0-m1-foundation]
    paths:
      - .github/workflows/temporary-gofmt-stage.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
      - name: Format staged files and push if needed
        run: |
          gofmt -w internal/apiv1/types.go internal/daemon/profile_snapshot_stage_linux.go internal/daemon/profile_snapshot_stage_linux_test.go internal/profileupdate/declaration_stage.go
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/apiv1/types.go internal/daemon/profile_snapshot_stage_linux.go internal/daemon/profile_snapshot_stage_linux_test.go internal/profileupdate/declaration_stage.go
            git commit -m 'style: gofmt guarded profile declaration stage'
            git push origin HEAD:feat/m0-m1-foundation
          fi
