name: one-time-history-check-cleanup-format
on:
  push:
    branches: [feat/m0-m1-foundation]
    paths:
      - .github/workflows/one-time-history-check-cleanup-format.yml
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
      - name: Format targeted historical check cleanup
        run: |
          gofmt -w internal/storage/recovery_check_cleanup.go internal/storage/recovery_check_cleanup_test.go internal/daemon/historical_check.go internal/daemon/historical_check_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/storage/recovery_check_cleanup.go internal/storage/recovery_check_cleanup_test.go internal/daemon/historical_check.go internal/daemon/historical_check_test.go
            git commit -m "style(m4): gofmt historical dry-run reclamation"
            git push origin HEAD:feat/m0-m1-foundation
          fi
