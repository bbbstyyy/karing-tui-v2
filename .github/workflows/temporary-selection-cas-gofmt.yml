name: temporary-selection-cas-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/temporary-selection-cas-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'bbbstyyy/karing-tui-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - name: Format selection CAS files
        run: |
          gofmt -w internal/storage/selection.go internal/storage/store.go internal/daemon/selection.go internal/daemon/selection_checked.go internal/apiv1/types.go internal/daemon/server.go internal/client/client.go internal/storage/selection_checked_test.go internal/daemon/selection_checked_test.go internal/client/selection_checked_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/storage/selection.go internal/storage/store.go internal/daemon/selection.go internal/daemon/selection_checked.go internal/apiv1/types.go internal/daemon/server.go internal/client/client.go internal/storage/selection_checked_test.go internal/daemon/selection_checked_test.go internal/client/selection_checked_test.go
            git commit -m "style(m4): gofmt checked selection API and tests"
            git push origin HEAD:feat/m0-m1-foundation
          fi
