name: temporary profile stage gofmt
on:
  push:
    branches: [feat/m0-m1-foundation]
    paths:
      - .github/workflows/temporary-profile-stage-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
      - name: Format profile stage files
        run: |
          gofmt -w internal/app/profile_stage_cli.go internal/daemon/profile_snapshot_stage_linux.go internal/profileupdate/declaration_preview.go internal/profileupdate/declaration_preview_guard_test.go internal/storage/profile_declaration_guard_test.go
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/app/profile_stage_cli.go internal/daemon/profile_snapshot_stage_linux.go internal/profileupdate/declaration_preview.go internal/profileupdate/declaration_preview_guard_test.go internal/storage/profile_declaration_guard_test.go
            git commit -m 'style: format guarded profile staging and concurrency tests'
            git push origin HEAD:feat/m0-m1-foundation
          fi
