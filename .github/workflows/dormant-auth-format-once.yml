name: dormant-auth-format-once
on:
  push:
    paths:
      - '.github/workflows/dormant-auth-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/m0-m1-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Format dormant authentication implementation and tests
        run: |
          gofmt -w internal/backupclosure/inert_restore_dormant_auth_linux.go internal/backupclosure/inert_restore_dormant_auth_linux_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/backupclosure/inert_restore_dormant_auth_linux.go internal/backupclosure/inert_restore_dormant_auth_linux_test.go
            git commit -m "style(restore): gofmt dormant bundle reauthentication"
            git push
          fi
