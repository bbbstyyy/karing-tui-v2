name: temporary-confirmed-selection-tui-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/temporary-confirmed-selection-tui-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'bbbstyyy/karing-tui-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - name: Format applied selector TUI files
        run: |
          gofmt -w internal/daemon/selection.go internal/apiv1/types.go internal/daemon/server.go internal/tui/observations.go internal/tui/model.go internal/tui/selection_edit.go internal/daemon/selection_candidates_test.go internal/tui/selection_edit_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/daemon/selection.go internal/apiv1/types.go internal/daemon/server.go internal/tui/observations.go internal/tui/model.go internal/tui/selection_edit.go internal/daemon/selection_candidates_test.go internal/tui/selection_edit_test.go
            git commit -m "style(m4): gofmt confirmed selector TUI"
            git push origin HEAD:feat/m0-m1-foundation
          fi
