name: core-provenance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/core-provenance.yml'
      - 'scripts/verify-core-build.sh'
      - 'scripts/smoke-core-runtime.sh'
      - 'resources/core-entry/main.go.txt'
      - 'resources/core.lock.json'
permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false
      - name: Verify locked core build
        run: bash scripts/verify-core-build.sh "${{ matrix.arch }}"
