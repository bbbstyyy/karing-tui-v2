name: core-provenance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/core-provenance.yml'
      - 'scripts/verify-core-build.sh'
      - 'resources/core.lock.json'
permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false
      - name: Verify locked core build
        run: bash scripts/verify-core-build.sh "${{ matrix.arch }}"
