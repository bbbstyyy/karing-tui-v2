name: temporary-dashboard-apply-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/temporary-dashboard-apply-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'bbbstyyy/karing-tui-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - name: Format dashboard apply slice
        run: |
          gofmt -w internal/tui/checked_apply.go internal/tui/checked_apply_test.go internal/tui/model.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/tui/checked_apply.go internal/tui/checked_apply_test.go internal/tui/model.go
            git commit -m "style(m4): gofmt dashboard checked apply interaction"
            git push origin HEAD:feat/m0-m1-foundation
          fi
