name: one-time-m4-sqlite-logical-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/one-time-m4-sqlite-logical-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - name: Format memory-only SQLite validation changes
        run: |
          gofmt -w internal/backupclosure/sealed_archive_sqlite_linux.go internal/backupclosure/sealed_archive_sqlite_linux_test.go internal/backupclosure/closure.go internal/backupclosure/sealed_archive_preflight_linux.go internal/backupclosure/sealed_archive_preflight_linux_test.go internal/backupclosure/sealed_archive_integration_linux_test.go
          if ! git diff --quiet -- internal/backupclosure/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/backupclosure/
            git commit -m "style(m4): gofmt authenticated SQLite logical checks"
            git push origin HEAD:feat/m0-m1-foundation
          fi
