name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Build
        run: make build
