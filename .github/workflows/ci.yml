name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Dependency lock check
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum || test -n "$(git ls-files --others --exclude-standard -- go.sum)"; then
            git diff -- go.mod go.sum
            if test -f go.sum; then
              echo "--- generated go.sum ---"
              cat go.sum
            fi
            exit 1
          fi
      - name: Verify modules
        run: go mod verify
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Race test
        run: make test-race
      - name: Build
        run: make build
