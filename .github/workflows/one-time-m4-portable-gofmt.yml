name: one-time-m4-portable-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/one-time-m4-portable-gofmt.yml

permissions:
  contents: write

jobs:
  format-once:
    if: github.ref == 'refs/heads/feat/m0-m1-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Format only current M4 relocation Go files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/backupclosure/inert_restore_portable_preview_linux.go internal/backupclosure/inert_restore_portable_preview_linux_test.go
          if ! git diff --quiet -- internal/backupclosure/inert_restore_portable_preview_linux.go internal/backupclosure/inert_restore_portable_preview_linux_test.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- internal/backupclosure/inert_restore_portable_preview_linux.go internal/backupclosure/inert_restore_portable_preview_linux_test.go
            git commit -m "style(restore): gofmt portable path preview"
            git push origin HEAD:refs/heads/feat/m0-m1-foundation
          fi
