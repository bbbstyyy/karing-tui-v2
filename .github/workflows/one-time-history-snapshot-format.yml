name: one-time-history-snapshot-format
on:
  push:
    branches: [feat/m0-m1-foundation]
    paths:
      - .github/workflows/one-time-history-snapshot-format.yml
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
      - name: Format isolated historical snapshots and daemon checks
        run: |
          gofmt -w internal/coreartifact/ruleset_snapshot.go internal/coreartifact/ruleset_snapshot_test.go internal/daemon/historical_check.go internal/daemon/historical_resource_pins_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/coreartifact/ruleset_snapshot.go internal/coreartifact/ruleset_snapshot_test.go internal/daemon/historical_check.go internal/daemon/historical_resource_pins_test.go
            git commit -m "style(m4): gofmt isolated historical snapshots"
            git push origin HEAD:feat/m0-m1-foundation
          fi
