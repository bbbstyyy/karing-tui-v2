name: one-time-m4-candidate-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/one-time-m4-candidate-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - name: Format candidate code, tests and push
        run: |
          gofmt -w internal/backupclosure/inert_candidate_linux.go internal/backupclosure/inert_candidate_linux_test.go internal/backupclosure/sealed_archive_integration_linux_test.go
          if ! git diff --quiet -- internal/backupclosure/inert_candidate_linux.go internal/backupclosure/inert_candidate_linux_test.go internal/backupclosure/sealed_archive_integration_linux_test.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/backupclosure/inert_candidate_linux.go internal/backupclosure/inert_candidate_linux_test.go internal/backupclosure/sealed_archive_integration_linux_test.go
            git commit -m "style(m4): gofmt encrypted restore candidate isolation"
            git push origin HEAD:feat/m0-m1-foundation
          fi
