name: temporary-tui-overlay-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/temporary-tui-overlay-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'bbbstyyy/karing-tui-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - name: Format TUI overlay files
        run: |
          gofmt -w internal/tui/model.go internal/tui/overlay_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/tui/model.go internal/tui/overlay_test.go
            git commit -m "style(m4): gofmt confirmed node overlay UI"
            git push origin HEAD:feat/m0-m1-foundation
          fi
