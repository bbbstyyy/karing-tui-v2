name: temporary-checked-apply-capability-gofmt
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/temporary-checked-apply-capability-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'bbbstyyy/karing-tui-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - name: Format checked-apply capability API and test
        run: |
          gofmt -w internal/daemon/server.go internal/daemon/checked_apply_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/daemon/server.go internal/daemon/checked_apply_test.go
            git commit -m "style(m4): format checked apply capability test"
            git push origin HEAD:feat/m0-m1-foundation
          fi
