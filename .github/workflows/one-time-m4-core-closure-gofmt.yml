name: one-time-m4-core-closure-gofmt
on:
  push:
    paths:
      - '.github/workflows/one-time-m4-core-closure-gofmt.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Format M4 approved-core closure only
        run: |
          gofmt -w internal/coreartifact/core_pin_linux.go internal/coreartifact/core_pin_linux_test.go internal/coreartifact/ruleset_snapshot.go internal/coreartifact/ruleset_snapshot_recovery.go internal/backupclosure/closure.go internal/backupclosure/core_integration_linux_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add internal/coreartifact/core_pin_linux.go internal/coreartifact/core_pin_linux_test.go internal/coreartifact/ruleset_snapshot.go internal/coreartifact/ruleset_snapshot_recovery.go internal/backupclosure/closure.go internal/backupclosure/core_integration_linux_test.go
            git commit -m "style(m4): gofmt approved-core closure"
            git push origin HEAD:feat/m0-m1-foundation
          fi
