name: one-time-historical-check-format
on:
  push:
    branches: [feat/m0-m1-foundation]
    paths:
      - .github/workflows/one-time-historical-check-format.yml
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/m0-m1-foundation
      - name: Format guarded historical core check and tests
        run: |
          gofmt -w internal/daemon/historical_check.go internal/daemon/historical_check_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/daemon/historical_check.go internal/daemon/historical_check_test.go
            git commit -m "style(m4): gofmt gated historical core check"
            git push origin HEAD:feat/m0-m1-foundation
          fi
