name: one-time-recovery-preflight-format
on:
  push:
    branches:
      - feat/m0-m1-foundation
    paths:
      - .github/workflows/one-time-recovery-preflight-format.yml
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m0-m1-foundation
      - name: Format recovery preflight additions
        run: |
          gofmt -w internal/daemon/recovery_preflight.go internal/daemon/recovery_preflight_test.go internal/daemon/recovery_audit.go internal/apiv1/types.go internal/app/recovery_audit_cli.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/daemon/recovery_preflight.go internal/daemon/recovery_preflight_test.go internal/daemon/recovery_audit.go internal/apiv1/types.go internal/app/recovery_audit_cli.go
            git commit -m "style(m4): gofmt recovery preflight"
            git push origin HEAD:feat/m0-m1-foundation
          fi
